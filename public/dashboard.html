<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e7, #f8b6d2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 850px;
            max-width: 100%;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            color: #d94f8a;
            font-size: 22px;
            font-weight: bold;
        }

        .logout-btn {
            border: none;
            background: #f4a7c4;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #d96f9e;
        }

        /* WELCOME */

        .welcome {
            background: linear-gradient(135deg, #ffe4ef, #ffd1e3);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            color: #d94f8a;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .welcome p {
            color: #777;
            font-size: 15px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: #fff7fa;
            border: 1px solid #f8d5e2;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .card-icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .card h3 {
            color: #d94f8a;
            margin-bottom: 8px;
        }

        .card p {
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }

        /* MESSAGE */

        .message-box {
            background: #fff4f8;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .message-box h2 {
            color: #d94f8a;
            margin-bottom: 10px;
        }

        .message-box p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .dashboard {
                padding: 25px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .top-bar {
                gap: 15px;
            }
        }
    </style>
</head>


<body>

    <div class="dashboard">

        <!-- TOP BAR -->

        <div class="top-bar">

            <div class="logo">
                ♡ My Dashboard
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>


        <!-- WELCOME SECTION -->

        <div class="welcome">

            <h1>
                Hello, <span id="username">User!</span> 👋🏻
            </h1>

            <p>
                Welcome to your dashboard! 💗
            </p>

        </div>


        <!-- CARDS -->

        <div class="cards">

            <div class="card">

                <div class="card-icon">
                    👤
                </div>

                <h3>
                    Profile
                </h3>

                <p>
                    View your account information.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    🔐
                </div>

                <h3>
                    Account
                </h3>

                <p>
                    Your account is successfully connected.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    💗
                </div>

                <h3>
                    Welcome
                </h3>

                <p>
                    Thank you for using our system!
                </p>

            </div>

        </div>


        <!-- MESSAGE -->

        <div class="message-box">

            <h2>
                You're all set! ✨
            </h2>

            <p>
                You have successfully logged in to your account.
                Enjoy using the system! 💕
            </p>

        </div>

    </div>


    <script>

        // Get the username saved during login

        const username = localStorage.getItem("username");

        document.getElementById("username").textContent =
            username || "User";


        // Logout function

        function logout() {

            localStorage.removeItem("username");

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
